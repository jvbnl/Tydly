name: macOS

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "cursor/**"]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Audit signed debug app
        run: |
          CONFIGURATION=debug ./Scripts/build_app.sh
          ./Scripts/audit_privacy.sh
      - name: Assemble app bundle
        run: make app
      - name: Audit privacy boundary
        run: ./Scripts/audit_privacy.sh
      - name: Smoke-test app bundle
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/Tydly.app"
          log="$RUNNER_TEMP/Tydly.log"
          cp -R dist/Tydly.app "$app"
          mv .build "$RUNNER_TEMP/swift-build"
          "$app/Contents/MacOS/Tydly" >"$log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          sleep 3
          if ! kill -0 "$pid" 2>/dev/null; then
            cat "$log"
            exit 1
          fi
